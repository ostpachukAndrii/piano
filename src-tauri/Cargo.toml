[package]
name = "piano-tauri-backend"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "piano-tauri-backend"
path = "src/main.rs"

[lib]
name = "piano_tauri_backend"
path = "src/lib.rs"

[dependencies]
# Tauri
tauri = { version = "2.0", features = [] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"

# Database
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "sqlite"] }

# Async runtime
tokio = { version = "1.35", features = ["full"] }

# MIDI
midir = "0.9"

# Error handling
thiserror = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = "0.3"

# UUID
uuid = { version = "1.0", features = ["v4", "serde"] }

# Reuse domain models
piano-domain = { path = "../crates/piano-domain" }

[build-dependencies]
tauri-build = { version = "2.0", features = [] }
