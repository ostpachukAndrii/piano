title: "Example with All Features"
description: "Example demonstrating all features: single notes, chords, rests, and timing"
settings:
  tempo: 100
  time_signature: "4/4"
  key_signature: "C major"

measures:
  # Measure 1: Single notes with different durations
  - notes:
      - midi: 60  # Do - Quarter note
        duration: 1.0
      - midi: 62  # Re - Eighth notes
        duration: 0.5
      - midi: 64  # Mi
        duration: 0.5
      
  # Measure 2: More single notes
  - notes:
      - midi: 60  # Do
        duration: 1.0
      - midi: 65  # Fa
        duration: 0.5
      - midi: 69  # La
        duration: 1.0
      
  # Measure 3: Rest (silence)
  - notes:
      - midi: 67  # Sol
        duration: 1.0
      - rest: 1.0  # Silence for 1 beat
      
  # Measure 4: More notes
  - notes:
      - midi: 69  # La
        duration: 0.5
      - midi: 67  # Sol
        duration: 0.5
      - midi: 65  # Fa
        duration: 1.0
      
  # Measure 5: Mixed notes and rests
  - notes:
      - midi: 67  # Sol
        duration: 0.5
      - rest: 0.5
      - midi: 69  # La
        duration: 1.0
      - rest: 1.0
      
  # Measure 6: Notes and a chord
  - notes:
      - midi: 60  # Do
        duration: 1.0
      - midi: [60, 64, 67]  # C Major chord
        duration: 1.0
        chord: "C Major"
