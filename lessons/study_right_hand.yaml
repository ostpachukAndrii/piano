title: "Study Right Hand - Treble Clef Notes"
description: "Learn treble clef note positions. Take your time - no timing required."
mode: study_right_hand_no_timing
settings:
  tempo: 80
  time_signature: "4/4"
  key_signature: "C major"

measures:
  # Measure 1: Middle C scale ascending
  - notes:
      - midi: 60  # C4 (Middle C)
        duration: 1.0
        hand: right
      - midi: 62  # D4
        duration: 1.0
        hand: right
      - midi: 64  # E4
        duration: 1.0
        hand: right
      - midi: 65  # F4
        duration: 1.0
        hand: right

  # Measure 2: Continue ascending
  - notes:
      - midi: 67  # G4
        duration: 1.0
        hand: right
      - midi: 69  # A4
        duration: 1.0
        hand: right
      - midi: 71  # B4
        duration: 1.0
        hand: right
      - midi: 72  # C5
        duration: 1.0
        hand: right

  # Measure 3: Simple melody
  - notes:
      - midi: 60  # C4
        duration: 2.0
        hand: right
      - midi: 67  # G4
        duration: 2.0
        hand: right

  # Measure 4: Descending
  - notes:
      - midi: 72  # C5
        duration: 1.0
        hand: right
      - midi: 71  # B4
        duration: 1.0
        hand: right
      - midi: 69  # A4
        duration: 1.0
        hand: right
      - midi: 67  # G4
        duration: 1.0
        hand: right
